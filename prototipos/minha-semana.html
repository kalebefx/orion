<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion · Minha Semana (protótipo)</title>
<!-- orion:css (gerado por build.mjs, edite assets/orion.css) -->
<style>
/* ============================================================
   Orion · base compartilhada dos protótipos
   Tokens da identidade visual + navbar (dock) + componentes
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400&display=swap');

:root{
  /* identidade (logo) + Cloud Blue */
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --line:#C4D3E3;
  --line-soft:#DDE6F0;
  --accent:#7FA5D1;        /* azul suave da logo */
  --accent-strong:#456C9C; /* azul aço da logo */
  --accent-hi:#2F5080;
  --ink:#111C2D;           /* tinta da logo */
  --ink-2:#2A3A50;
  --muted:#5A6B80;
  --danger:#B4453A;
  --ok:#2F7D5B;
  --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
  --display:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* tema escuro (RF46): cores da identidade visual, não uma inversão automática */
:root[data-theme="dark"]{
  --bg:#0C1522;
  --surface:#111C2D;
  --line:#22344D;
  --line-soft:#1A2A40;
  --accent:#7FA5D1;
  --accent-strong:#7FA5D1;
  --accent-hi:#9BBDE0;
  --ink:#EEF2F7;
  --ink-2:#C4D3E3;
  --muted:#8DA0B8;
  --danger:#E07A6E;
  --ok:#5CC195;
  color-scheme:dark;
}
:root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .btn.save,:root[data-theme="dark"] .chip[aria-pressed="true"],:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#EEF2F7;color:#0C1522;border-color:#EEF2F7}
:root[data-theme="dark"] .btn-primary:hover,:root[data-theme="dark"] .btn.save:hover{background:#9BBDE0}
:root[data-theme="dark"] .card{box-shadow:0 20px 40px -30px rgba(0,0,0,.8)}
:root[data-theme="dark"] .toast,:root[data-theme="dark"] .tt{background:#1E2F45}
:root[data-theme="dark"] .dock{background:rgba(30,47,69,.9)}
body{transition:background-color .3s,color .3s}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}

/* ===== Navbar estilo macOS ===== */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px 6px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px;color:var(--accent-strong);transition:transform .6s var(--ease)}
.brand:hover svg{transform:rotate(72deg)}
.brand span{font-family:var(--display);font-weight:300;font-size:17px;letter-spacing:.2em}
.dock{display:flex;align-items:flex-end;gap:6px;padding:7px 10px;background:rgba(17,28,45,.88);backdrop-filter:blur(18px) saturate(1.4);border-radius:18px;box-shadow:0 10px 30px -12px rgba(17,28,45,.5),inset 0 1px 0 rgba(255,255,255,.08);height:56px}
.dock a{position:relative;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#C4D3E3;text-decoration:none;transform-origin:bottom center;transition:transform .18s var(--ease),background .2s,color .2s}
.dock a svg{width:20px;height:20px}
.dock a:hover,.dock a:focus-visible{background:rgba(255,255,255,.08);color:#fff}
.dock a.active{color:#fff;background:linear-gradient(160deg,#7FA5D1,#456C9C)}
.dock a.active::after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:#C4D3E3}
.dock a.soon{opacity:.5}
.dock .tip{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(-4px);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s var(--ease);z-index:50}
.dock .tip small{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:6px}
.dock a:hover .tip,.dock a:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.dock .sep{width:1px;height:26px;background:rgba(196,211,227,.2);margin:0 4px 8px}
.user{justify-self:end;display:flex;align-items:center;gap:12px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
.user{position:relative}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,#7FA5D1,#456C9C);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;transition:transform .2s var(--ease),box-shadow .2s}
.avatar:hover,.avatar[aria-expanded="true"]{transform:scale(1.08);box-shadow:0 0 0 4px rgba(127,165,209,.3)}
.umenu{position:absolute;top:calc(100% + 10px);right:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 40px -16px rgba(17,28,45,.45);z-index:60;animation:pop .18s var(--ease)}
.umenu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
.umenu .who b{display:block;font-size:13px}
.umenu .who span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.umenu a,.umenu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none}
.umenu a:hover,.umenu button:hover,.umenu a:focus-visible,.umenu button:focus-visible{background:var(--bg)}
.umenu .sair{color:var(--danger)}

/* ===== Switch (ativar/desativar) ===== */
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);transition:background .25s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:active::after{width:22px}
.switch[aria-checked="true"]:active::after{transform:translateX(14px)}

/* ===== Busca e abas de filtro ===== */
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:220px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(127,165,209,.3)}
.search svg{width:16px;height:16px;color:var(--muted)}
.search input{border:0;outline:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;position:relative}
.tabs button{height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .pill{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--bg);transition:left .3s var(--ease),width .3s var(--ease)}
.tabs button .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.7}

/* ===== Lista de itens (hábitos, hobbies) ===== */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.item{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:12px;transition:transform .25s var(--ease),box-shadow .25s,opacity .3s,border-color .2s}
.item:hover{transform:translateY(-2px);box-shadow:0 22px 40px -24px rgba(17,28,45,.5)}
.item.off{opacity:.62}
.item.off:hover{opacity:.85}
.item .row1{display:flex;align-items:center;gap:10px}
.item h3{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--c,#7FA5D1) 13%,transparent);color:var(--ink-2)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.origem{background:var(--bg);font-family:var(--mono);font-size:10.5px}
.tag.none{background:none;color:var(--muted);padding-left:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line-soft);padding-top:10px}
.nums div span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.nums div b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.empty-state{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
@media (pointer:coarse){.item .acts{opacity:1}}
.enter{animation:entra .45s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* ===== Página ===== */
.page{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 24px 24px;gap:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
.title p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(17,28,45,.03),0 20px 40px -30px rgba(17,28,45,.35)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== Controles ===== */
.seg{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{height:32px;min-width:34px;padding:0 10px;border-radius:7px;display:grid;place-items:center;transition:background .15s}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg svg{width:16px;height:16px}
.seg .lbl{min-width:150px;text-align:center;font-weight:600;font-size:13px}
.btn-primary{height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .15s var(--ease),background .2s}
.btn-primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
.btn-primary svg{width:16px;height:16px}
.btn-primary kbd{font-family:var(--mono);font-size:11px;opacity:.6;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 5px}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:all .15s var(--ease)}
.chip:hover{border-color:var(--accent-strong)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn.del:hover{background:rgba(180,69,58,.1);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}

/* ===== Modal ===== */
dialog{margin:auto;border:0;padding:0;border-radius:18px;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(17,28,45,.5)}
dialog::backdrop{background:rgba(17,28,45,.35);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.m-head h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.m-head .path{font-family:var(--mono);font-size:11px;color:var(--muted)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--bg)}
.x svg{width:16px;height:16px}
dialog form,.m-body{padding:8px 20px 20px;display:grid;gap:14px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f label small{font-family:var(--mono);font-weight:400;color:var(--muted);float:right}
.f input,.f select,.f textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;color:var(--ink);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.f textarea{height:72px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(127,165,209,.3)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.err{font-size:12.5px;color:var(--danger);background:rgba(180,69,58,.08);border-radius:8px;padding:8px 10px;display:none}
.err.show{display:block}
.m-foot{display:flex;gap:8px;align-items:center}
.m-foot .sp{flex:1}
.btn{height:38px;padding:0 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);transition:background .15s}
.btn:hover{background:var(--bg)}
.btn.del{color:var(--danger);border-color:transparent}
.btn.del:hover{background:rgba(180,69,58,.08)}
.btn.save{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.save:hover{background:var(--accent-strong)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.danger:hover{background:#963329}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:100;box-shadow:0 14px 30px -12px rgba(17,28,45,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .rn{font-family:var(--mono);font-size:11px;color:#C4D3E3;border:1px solid rgba(196,211,227,.3);border-radius:5px;padding:1px 6px}
.toast.bad{background:#3A1814}

/* ===== Tooltip de gráfico ===== */
.tt{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:90;min-width:120px;box-shadow:0 12px 24px -10px rgba(17,28,45,.6)}
.tt.show{opacity:1;transform:none}
.tt b{font-weight:600}
.tt .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:11px;color:#C4D3E3}
.tt .r span:last-child{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.dock a{width:36px;height:36px}.topbar{grid-template-columns:auto 1fr;gap:12px}.dock{justify-self:end}.user{display:none}}
/* ===== Barra inferior e gaveta (celular) ===== */
.tabbar,.sheet-bg{display:none}
@media (max-width:700px){
  /* topo: logo completa à esquerda, avatar à direita; o dock sai do topo */
  .topbar{display:flex;justify-content:space-between;padding:12px 16px 6px;padding-top:max(12px,env(safe-area-inset-top))}
  .topbar .dock,.topbar .clock{display:none}
  .brand svg{width:24px;height:24px}
  .brand span{font-size:15px}
  .page{padding:6px 14px calc(84px + env(safe-area-inset-bottom))}
  .title h1{font-size:24px}

  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:64px;padding:6px;border-radius:20px;background:rgba(17,28,45,.9);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 34px -12px rgba(17,28,45,.6),inset 0 1px 0 rgba(255,255,255,.08);z-index:45}
  :root[data-theme="dark"] .tabbar{background:rgba(30,47,69,.92)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:#8DA0B8;text-decoration:none;font-size:10.5px;font-weight:600;transition:color .2s,background .25s var(--ease),transform .15s var(--ease);-webkit-tap-highlight-color:transparent;min-width:0}
  .tabbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar svg{width:21px;height:21px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .tabbar .on{color:#fff;background:linear-gradient(160deg,rgba(127,165,209,.35),rgba(69,108,156,.35))}
  .tabbar .on svg{transform:translateY(-1px) scale(1.08)}
  .tabbar a:active,.tabbar button:active{transform:scale(.92)}

  .sheet-bg{display:block;position:fixed;inset:0;background:rgba(17,28,45,0);z-index:70;transition:background .25s}
  .sheet-bg[hidden]{display:none}
  .sheet-bg.open{background:rgba(17,28,45,.4)}
  .sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border-radius:22px;padding:8px 8px max(10px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px -10px rgba(17,28,45,.4)}
  .sheet-bg.open .sheet{transform:none}
  .sheet .grip{display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
  .sheet a,.sheet button{display:flex;align-items:center;gap:14px;width:100%;height:54px;padding:0 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;text-align:left}
  .sheet a:active,.sheet button:active,.sheet .on{background:var(--bg)}
  .sheet svg{width:21px;height:21px;color:var(--accent-strong)}
  .sheet i{margin-left:auto;font-style:normal;color:var(--muted);font-size:20px}
  .sheet .sair,.sheet .sair svg{color:var(--danger)}
  .sheet-sep{height:1px;background:var(--line-soft);margin:6px 10px}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
  .umenu{right:-4px}
}
/* toque: alvos de pelo menos 44px (WCAG 2.5.8) */
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .x{width:44px;height:44px}
  .seg button{height:40px;min-width:44px}
  .chip{height:36px}
}
@media (max-width:700px){ body .savebar{bottom:calc(84px + env(safe-area-inset-bottom))} }
/* celular: barra de busca + abas + botão em duas linhas (Hábitos, Hobby) */
@media (max-width:700px){
  .head .controls.toolbar{display:grid;grid-template-columns:1fr auto;width:100%;gap:8px}
  .toolbar .search{grid-column:1/-1;min-width:0}
  .toolbar .tabs{min-width:0}
  .toolbar .tabs button{padding:0 8px;flex:1}
  .btn-primary kbd,.search kbd{display:none}
  .items{grid-template-columns:1fr}
}
</style>

<style>
/* ===== Específico da Minha Semana ===== */
:root{--row:12px;--gutter:60px} /* 15 min = 12px → 1h = 48px */
body{overflow:hidden;height:100dvh}
.stats{display:flex;gap:4px;font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.stats span{padding:7px 10px;border-radius:7px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
.vseg button{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:0 12px}
.vseg button svg{width:15px;height:15px}
.title .mstat{display:none}
.fg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (min-width:901px){
  /* três colunas equilibradas: título | como ver + semana | resumo + ação */
  .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
  .c-mid{justify-self:center}
  .c-end{justify-self:end}
  .filters{justify-content:space-between}
  .fg-end{justify-content:flex-end}
}
@media (min-width:901px) and (max-width:1250px){
  /* telas médias: o resumo desce para não espremer o centro */
  .head{grid-template-columns:auto 1fr auto}
  .c-end .stats{display:none}
}
.fbtn,.fab{display:none}

/* Filtros (RF12) */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters .lbl{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:2px}
.filters .div{width:1px;height:18px;background:var(--line);margin:0 6px}
.clear{font-size:12px;color:var(--accent-strong);font-weight:500;padding:4px 6px;display:none}
.clear.show{display:block}

/* Quadro e cabeçalho dos dias */
.board{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.days{display:grid;grid-template-columns:var(--gutter) repeat(7,1fr);border-bottom:1px solid var(--line)}
.board[data-view="lista"] .days{grid-template-columns:repeat(7,1fr)}
.board[data-view="lista"] .days .tz{display:none}
.days .tz{font-family:var(--mono);font-size:10px;color:var(--muted);display:grid;place-items:end center;padding-bottom:8px}
.day{padding:10px 12px 8px;display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;column-gap:8px;border-left:1px solid var(--line-soft)}
.board[data-view="lista"] .day:first-of-type{border-left:0}
.day .n{font-size:20px;font-weight:600;letter-spacing:-.02em;width:34px;height:34px;display:grid;place-items:center;border-radius:10px}
.day .w{font-size:12px;color:var(--muted)}
.day .load{justify-self:end;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day .prog{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line-soft);margin-top:7px;overflow:hidden}
.day .prog i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .5s var(--ease)}
.day.today .n{background:var(--accent-strong);color:#fff}
.day.today .w{color:var(--accent-strong);font-weight:600}

/* ===== GRADE ===== */
.allday{display:grid;grid-template-columns:var(--gutter) repeat(7,1fr);border-bottom:1px solid var(--line);max-height:104px;overflow-y:auto;scrollbar-width:thin}
.allday .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:grid;place-items:center;text-align:center;line-height:1.2;padding:4px}
.acell{border-left:1px solid var(--line-soft);padding:5px 4px;display:flex;flex-direction:column;gap:3px;min-height:34px}
.uchip{display:flex;align-items:center;gap:6px;min-height:24px;padding:2px 6px 2px 4px;border-radius:7px;background:var(--c-soft);border:1px solid var(--c-line);font-size:11.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:transform .15s var(--ease),opacity .25s}
.uchip:hover{transform:translateX(2px)}
.uchip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip.done span{text-decoration:line-through;opacity:.6}
.uchip.dim{opacity:.2}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grid{display:grid;grid-template-columns:var(--gutter) repeat(7,1fr);height:calc(var(--row)*96);position:relative}
.hours{position:relative}
.hours span{position:absolute;right:10px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.col{position:relative;border-left:1px solid var(--line-soft);background-image:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px calc(var(--row)*4));cursor:copy}
.col.today{background-color:rgba(127,165,209,.07)}
.col.past{background-color:rgba(238,242,247,.55)}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--danger);z-index:6;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.block{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px 6px 11px;background:var(--c-soft);color:var(--ink);overflow:hidden;cursor:grab;user-select:none;touch-action:none;z-index:2;border:1px solid var(--c-line);transition:box-shadow .2s,transform .2s var(--ease),opacity .25s,filter .25s}
.block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.block:hover{box-shadow:0 8px 20px -10px rgba(17,28,45,.45);transform:translateY(-1px);z-index:4}
.block .t{font-weight:600;font-size:12.5px;line-height:1.25;letter-spacing:-.01em;padding-right:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .h{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);opacity:.8;margin-top:2px}
.block .attrs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.block .attrs i,.lcard .attrs i{font-style:normal;font-size:10px;font-weight:500;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.7);color:var(--ink-2)}
.block.short{padding-top:3px;padding-bottom:3px}
.block.short .t{font-size:11.5px}
.block.short .h,.block.short .attrs{display:none}
.block.done{background:repeating-linear-gradient(-45deg,var(--c-soft) 0 6px,rgba(255,255,255,.55) 6px 12px)}
.block.done .t{text-decoration:line-through;text-decoration-color:rgba(17,28,45,.35)}
.check{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--c);background:rgba(255,255,255,.8);display:grid;place-items:center;transition:all .15s}
.check svg,.mini svg{width:11px;height:11px;opacity:0;color:#fff}
.block.done .check{background:var(--c)}
.block.done .check svg{opacity:1}
.check:disabled,.mini:disabled{opacity:.35;cursor:not-allowed}
.mini{position:relative;width:16px;height:16px;flex:none;border-radius:5px;border:1.5px solid var(--c);background:rgba(255,255,255,.7);display:grid;place-items:center}
.uchip.done .mini{background:var(--c)}
.uchip.done .mini svg{opacity:1}
.block.dim{opacity:.18;filter:grayscale(.6)}
.block.dragging{cursor:grabbing;z-index:30;box-shadow:0 18px 40px -12px rgba(17,28,45,.55);transition:box-shadow .2s;opacity:.92}
.block.back{transition:transform .35s var(--ease)}
.ghost{position:absolute;left:4px;right:4px;border-radius:9px;border:1.5px dashed var(--accent-strong);background:rgba(127,165,209,.15);z-index:1;pointer-events:none;padding:5px 8px}
.ghost span{font-family:var(--mono);font-size:10.5px;color:var(--accent-strong);font-weight:500}
.ghost.bad{border-color:var(--danger);background:rgba(180,69,58,.1)}
.ghost.bad span{color:var(--danger)}
.board[data-view="lista"] .grade-only,.board[data-view="grade"] .lista-only{display:none!important}

/* ===== LISTA ===== */
.lanes{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr)}
.lane{border-left:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0;min-width:0}
.lane:first-child{border-left:0}
.lane.today{background:rgba(127,165,209,.06)}
.lane-list{flex:1;overflow-y:auto;padding:10px 8px 4px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.lane-list:hover{scrollbar-width:thin}
.lcard{flex:none;position:relative;display:flex;gap:9px;align-items:flex-start;padding:9px 9px 9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 0 rgba(17,28,45,.03);cursor:grab;user-select:none;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s,opacity .25s,border-color .2s}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.lcard:hover{transform:translateY(-2px);box-shadow:0 12px 22px -14px rgba(17,28,45,.5);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.lcheck{position:relative;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;margin-top:1px;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.lcheck::after{content:"";position:absolute;inset:-11px}
.lcheck svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.lcheck:hover{background:color-mix(in srgb,var(--c) 15%,transparent)}
.lcheck:active{transform:scale(.85)}
.lcheck:disabled{opacity:.35;cursor:not-allowed}
.lcard.done .lcheck{background:var(--c)}
.lcard.done .lcheck svg{opacity:1;transform:none}
.lbody{flex:1;min-width:0}
.lt{font-size:13px;font-weight:600;line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.lcard.done{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.lcard.done .lt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
.lmeta{display:flex;align-items:center;gap:3px 8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.lmeta svg{width:11px;height:11px}
.lmeta .tm{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.lmeta .hab{font-family:var(--sans);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lcard .attrs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.lcard .attrs i{background:color-mix(in srgb,var(--c) 12%,transparent)}
.lcard.dim{opacity:.2;filter:grayscale(.6)}
.lcard.lifted{opacity:.25}
.lghost{position:fixed;pointer-events:none;z-index:90;transform:rotate(2deg) scale(1.03);box-shadow:0 24px 44px -14px rgba(17,28,45,.55);cursor:grabbing;transition:none}
.lph{height:6px;border-radius:3px;background:var(--accent-strong);opacity:.7;margin:-2px 2px;flex:none}
.lph.bad{background:var(--danger)}
.lane-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;border:1.5px dashed var(--line-soft);border-radius:12px}
.qadd{padding:4px 8px 10px}
.qadd input{width:100%;height:36px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;padding:0 10px;font:inherit;font-size:12.5px;color:var(--ink);transition:border-color .15s,background .15s}
.qadd input::placeholder{color:var(--muted)}
.qadd input:hover{border-color:var(--accent)}
.qadd input:focus{outline:0;border-style:solid;border-color:var(--accent-strong);background:var(--surface);box-shadow:0 0 0 3px rgba(127,165,209,.25)}
.lcard.pop{animation:popin .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{from{transform:scale(.85);opacity:0}}

/* Modal do bloco */
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks .chip{height:28px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.toggle input{width:18px;height:18px;accent-color:var(--accent-strong)}
.toggle span{font-weight:500}
.toggle small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.hora-sw{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.hora-sw small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.hora-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s;max-height:90px}
.hora-row.off{max-height:0;opacity:0;margin-top:-14px}

@media (max-width:900px){.stats{display:none}}

/* ===== Celular: um dia por vez, cabeçalho enxuto, filtros recolhidos ===== */
@media (max-width:700px){
  :root{--gutter:44px}
  .page{gap:10px}
  .head{flex-wrap:wrap;align-items:center;gap:10px}
  .head .title{width:100%}
  .title .mstat{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
  .title .mstat b{color:var(--ink);font-weight:500}
  .title #range{display:none}
  .head .controls{gap:6px;flex-wrap:nowrap}
  .c-end{margin-left:auto}
  .fg{flex-wrap:nowrap}
  .filters .fg{flex:none}
  #weekSeg{margin-right:auto}
  .fbtn .n[hidden]{display:none}
  body:has(.board[data-view="lista"]) .fab{display:none} /* na lista, o "+ Adicionar" já faz esse papel */
  #newBtn,#weekSeg #today{display:none}
  .vseg button{padding:0 9px}
  .vseg button .txt{display:none}
  .fbtn{display:grid;position:relative}
  .fbtn .n{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--accent-strong);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .filters{display:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
  .filters.open{display:flex;animation:pop .2s var(--ease)}
  .filters .chip,.filters .lbl{flex:none}
  .days,.board[data-view="lista"] .days{grid-template-columns:repeat(7,1fr);padding:6px;gap:2px}
  .days .tz{display:none}
  .day{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;padding:6px 0 5px;border-radius:12px;cursor:pointer;transition:background .2s}
  .day .n{font-size:16px;width:30px;height:30px;order:2}
  .day .w{order:1;font-size:11px}
  .day .load{order:3;margin:0;font-size:9.5px;justify-self:auto}
  .day .prog{order:4;width:60%;margin-top:3px}
  .day.sel{background:var(--bg)}
  .day.sel .n{outline:2px solid var(--accent-strong);outline-offset:1px}
  .allday{grid-template-columns:var(--gutter) 1fr;max-height:120px}
  .grid{grid-template-columns:var(--gutter) 1fr}
  .col:not(.sel),.acell:not(.sel){display:none}
  .lanes{grid-template-columns:1fr}
  .lane:not(.sel){display:none}
  .lane-list{padding:12px 12px 6px;gap:9px}
  .lcard{padding:13px 12px 13px 14px;border-radius:14px}
  .lt{font-size:15px}
  .lmeta{font-size:11.5px}
  .lcheck{width:26px;height:26px}
  .qadd{padding:4px 12px 12px}
  .qadd input{height:44px;font-size:14px}
  .block .t{font-size:13.5px}
  .block .h{font-size:11.5px}
  .fab{display:grid;place-items:center;position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:linear-gradient(160deg,#7FA5D1,#456C9C);color:#fff;box-shadow:0 14px 28px -10px rgba(69,108,156,.7);z-index:44;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .fab:active{transform:scale(.9) rotate(90deg)}
  .fab svg{width:24px;height:24px}
  .swipe-l{animation:swl .28s var(--ease)}
  .swipe-r{animation:swr .28s var(--ease)}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto}
  dialog[open]{animation:sobe .3s cubic-bezier(.2,.9,.25,1)}
}
@keyframes swl{from{transform:translateX(40px);opacity:.3}}
@keyframes swr{from{transform:translateX(-40px);opacity:.3}}
@keyframes sobe{from{transform:translateY(100%)}}
@media (pointer:coarse){
  .check{width:22px;height:22px}
  .check::after,.mini::after{content:"";position:absolute;inset:-11px}
  .uchip{min-height:34px}
}

/* tema escuro: troca os brancos fixos por transparências */
:root[data-theme="dark"] .col.past{background-color:rgba(0,0,0,.18)}
:root[data-theme="dark"] .col.today,:root[data-theme="dark"] .lane.today{background-color:rgba(127,165,209,.06)}
:root[data-theme="dark"] .block,:root[data-theme="dark"] .uchip{--c-soft:color-mix(in srgb,var(--c) 22%,var(--surface))}
:root[data-theme="dark"] .block.done{background:repeating-linear-gradient(-45deg,var(--c-soft) 0 6px,rgba(255,255,255,.04) 6px 12px)}
:root[data-theme="dark"] .block .attrs i{background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .block .h{opacity:1}
:root[data-theme="dark"] .check,:root[data-theme="dark"] .mini{background:transparent}
:root[data-theme="dark"] .block.done .t{text-decoration-color:rgba(238,242,247,.4)}
</style>

<body>
<header class="topbar"></header>

<main class="page">
  <section class="head">
    <div class="title"><h1>Minha Semana</h1><p id="range"></p><p class="mstat" id="mstat"></p></div>
    <div class="controls c-mid">
      <div class="seg vseg" role="group" aria-label="Modo de visualização">
        <button data-view="grade" aria-pressed="true" title="Grade com horários (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M9 4v17M15 4v17"/></svg><span class="txt">Grade</span></button>
        <button data-view="lista" aria-pressed="false" title="Lista sem horário fixo (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="3" y="14" width="7" height="6" rx="1.5"/><rect x="14" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/></svg><span class="txt">Lista</span></button>
      </div>
      <div class="seg" role="group" aria-label="Trocar semana" id="weekSeg">
        <button id="prev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="today" style="font-size:13px;font-weight:600">Hoje</button>
        <button id="next" aria-label="Próxima semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="controls c-end">
      <div class="stats" aria-label="Resumo da semana">
        <span>planejado <b id="sPlan">0h</b></span>
        <span>feito <b id="sDone">0h</b></span>
        <span>consistência <b id="sCons">—</b></span>
      </div>
      <button class="icon-btn fbtn" id="fBtn" aria-label="Filtros" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span class="n" id="fN" hidden></span></button>
      <button class="btn-primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo bloco <kbd>N</kbd></button>
    </div>
  </section>

  <section class="filters" id="filters" aria-label="Filtrar blocos">
    <div class="fg"><span class="lbl">atributos</span><div id="fAttr" style="display:contents"></div></div>
    <div class="fg fg-end"><button class="clear" id="clear">limpar filtros</button><span class="lbl">hábitos</span><div id="fHab" style="display:contents"></div></div>
  </section>

  <section class="board card" id="board" data-view="grade" aria-label="Semana">
    <div class="days" id="days"></div>
    <div class="allday grade-only" id="allday"></div>
    <div class="scroll grade-only" id="scroll"><div class="grid" id="grid"></div></div>
    <div class="lanes lista-only" id="lanes"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Novo bloco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="modal" aria-labelledby="mTitle">
  <div class="m-head">
    <div><h2 id="mTitle">Novo bloco</h2><div class="path" id="mPath"></div></div>
    <button class="x" type="button" id="mClose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <form id="form" novalidate>
    <div class="f"><label for="fAcao">Ação <small id="cAcao">0/80</small></label><input id="fAcao" maxlength="80" placeholder="Ex.: Correr 5 km" autocomplete="off"></div>
    <div class="f"><label for="fData">Data</label><input id="fData" type="date"></div>
    <div class="hora-sw"><button type="button" class="switch" role="switch" id="fComHora" aria-checked="true" aria-label="Definir horário"></button>Definir horário<small id="horaHint">RN20</small></div>
    <div class="hora-row" id="horaRow">
      <div class="f"><label for="fIni">Início</label><select id="fIni"></select></div>
      <div class="f"><label for="fFim">Fim</label><select id="fFim"></select></div>
    </div>
    <div class="f"><label for="fHabito">Hábito <small>opcional · só ativos</small></label><select id="fHabito"></select><p class="hint">Ao escolher um hábito, os atributos dele entram no bloco (RN23).</p></div>
    <div class="f"><label>Atributos</label><div class="picks" id="fAttrs"></div></div>
    <div class="f"><label for="fDesc">Descrição <small id="cDesc">0/500</small></label><textarea id="fDesc" maxlength="500" placeholder="Detalhes, links, observações…"></textarea></div>
    <label class="toggle" id="tWrap"><input type="checkbox" id="fDone"><span>Concluído</span><small id="tHint"></small></label>
    <div class="err" id="err" role="alert"></div>

/* pseudoaleatório determinístico: o mesmo dia gera sempre os mesmos blocos */
function rnd(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }

let _seq = 1;

const BLOCOS = [];
/** Garante que os blocos de [de, ate] existem (gera a partir da rotina). */
function garantirPeriodo(de, ate){
  const agora = new Date();
  for (let d = new Date(de); d <= ate; d = addDays(d,1)){
    const k = iso(d);
    if (_gerados.has(k)) continue;
    _gerados.add(k);
    ROTINA[(d.getDay()+6)%7].forEach(([i,f,acao,hab,attrs], n) => {
      if (rnd(k+n+'x') < 0.12) return; // às vezes o bloco não foi planejado
      if (i != null && BLOCOS.some(o => o.data === k && !semHorario(o) && i*60 < o.fim && o.ini < f*60)) return; // não gera por cima de um bloco seu (RN21)

function contar(el, alvo, fmt = v => Math.round(v), ms = 650){
  if (!el) return;

}
/* pequeno "estouro" de partículas na cor dada: recompensa visual ao concluir algo */
function estouro(x, y, cor = '#456C9C'){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 10; i++){
    const p = document.createElement('i');
    const a = (Math.PI * 2 * i) / 10, d = 22 + Math.random() * 14;
    p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:5px;height:5px;border-radius:50%;background:${cor};pointer-events:none;z-index:200;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s`;
    document.body.appendChild(p);
    requestAnimationFrame(() => { p.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.4)`; p.style.opacity = 0; });

<script>
/* Minha Semana · RF06–RF12, RF50 · regras RN18–RN24, RN26, RN28, RN37

const porOrdem = (a, b) => ordemDe(a) - ordemDe(b) || (a.ini ?? -1) - (b.ini ?? -1);

/* ---------- render ---------- */
function render(anim){

    const pct = doDia.length ? doDia.filter(b => b.concluido).length / doDia.length * 100 : 0;
    const info = view === 'lista' ? (doDia.length ? `${doDia.filter(b => b.concluido).length}/${doDia.length}` : '') : (total ? fmtDur(total) : '');

/* ---------- grade ---------- */
function renderGrade(days, doWeek, hoje){
  const semHora = doWeek.filter(semHorario);

/* ---------- lista ---------- */
function renderLista(days, doWeek, hoje, anim){

function lcardHTML(b, anim){

    <button class="lcheck" data-check="${b.id}" ${pode?'':'disabled'} aria-label="${b.concluido?'Desmarcar':'Marcar'} ${esc(b.acao)}" title="${pode?'Concluído':'Ainda não começou (RN37)'}">${CHECK}</button>
    <div class="lbody"><div class="lt">${esc(b.acao)}</div>
      <div class="lmeta">${semHorario(b) ? '<span class="tm">sem horário</span>' : `<span class="tm">${CLOCK}${fmtMin(b.ini)}–${fmtMin(b.fim)}</span>`}${hab ? `<span class="hab">${esc(hab.nome)}</span>` : ''}</div>

// adicionar rápido: digita e Enter, o bloco nasce sem horário no fim do dia
$('lanes').addEventListener('submit', e => {
  e.preventDefault();

  BLOCOS.push(b); salvar(); render(b.id);
  toast(`“${esc(acao)}” adicionado`, 'RF07');
});

function renderFiltros(){
  $('fAttr').innerHTML = ATRIBUTOS.map(a => `<button class="chip" data-fa="${a.id}" aria-pressed="${filtroAttr.has(a.id)}"><span class="dot" style="background:${a.cor}"></span>${esc(a.nome)}</button>`).join('');
  $('fHab').innerHTML = HABITOS.map(h => `<button class="chip" data-fh="${h.id}" aria-pressed="${filtroHab.has(h.id)}">${esc(h.nome)}</button>`).join('');
  const n = filtroAttr.size + filtroHab.size;
  $('clear').classList.toggle('show', n > 0);
  $('fN').hidden = !n; $('fN').textContent = n;
}
function weekNum(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }

/* ---------- concluir (RF50 · RN37) ---------- */
document.addEventListener('click', e => {
  const ck = e.target.closest('[data-check]');
  if (!ck || ck.disabled) return;
  e.stopPropagation();
  const b = BLOCOS.find(x => x.id == ck.dataset.check); b.concluido = !b.concluido; salvar(); render();
  if (b.concluido) estouro(e.clientX, e.clientY, corDe(b)); // recompensa visual
  toast(b.concluido ? (semHorario(b) ? `“${esc(b.acao)}” feito!` : `Bloco concluído · +${fmtDur(duracao(b))} feitas`) : 'Bloco desmarcado', 'RF50');
}, true);

/* ---------- grade: arrastar com horário (RF11 · RN24) ---------- */
let drag = null;
$('grid').addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.check')) return;
  const el = e.target.closest('.block'); if (!el) return;
  const r = el.getBoundingClientRect();
  drag = {el, b: BLOCOS.find(x => x.id == el.dataset.id), x0:e.clientX, y0:e.clientY, offY:e.clientY - r.top, moved:false, ghost:null, target:null};
  el.setPointerCapture(e.pointerId);
});
$('grid').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx,dy) < 5) return;
  if (!drag.moved){ drag.moved = true; drag.el.classList.add('dragging'); }
  drag.el.style.transform = `translate(${dx}px,${dy}px) scale(1.02)`;
  const col = [...document.querySelectorAll('.col')].find(c => { const r = c.getBoundingClientRect(); return r.width && e.clientX >= r.left && e.clientX < r.right; });
  if (!col) return;

  const cand = {data:col.dataset.date, ini, fim:ini+dur};
  const motivo = validarPos(cand, drag.b.id);
  drag.target = {...cand, motivo};
  if (!drag.ghost){ drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost'; }
  if (drag.ghost.parentNode !== col) col.appendChild(drag.ghost);
  drag.ghost.style.top = (Math.max(0,ini)/STEP*ROW+1) + 'px';
  drag.ghost.style.height = (dur/STEP*ROW-2) + 'px';
  drag.ghost.classList.toggle('bad', !!motivo);
  drag.ghost.innerHTML = `<span>${fmtMin(Math.max(0,ini))}–${fmtMin(Math.min(1440,ini+dur))}</span>`;
  const s = $('scroll').getBoundingClientRect();
  if (e.clientY < s.top + 40) $('scroll').scrollTop -= 10;

$('grid').addEventListener('pointerup', () => {

  if (t.motivo){ voltar(d.el); toast(t.motivo.msg, t.motivo.rn, true); return; }
  Object.assign(d.b, {data:t.data, ini:t.ini, fim:t.fim});
  const desmarcou = d.b.concluido && !jaComecou(d.b); // RN37
  if (desmarcou) d.b.concluido = false;
  salvar(); render();
  const dt = parseIso(t.data), onde = `${nomeDia(dt)} ${pad(dt.getDate())}/${pad(dt.getMonth()+1)}, ${fmtMin(t.ini)}`;
  if (desmarcou) toast(`“${esc(d.b.acao)}” movido para ${onde}. Ainda não começou, então saiu de concluído`, 'RN37');
  else toast(`“${esc(d.b.acao)}” movido para ${onde}`, 'RF11');
});
function voltar(el){ el.classList.remove('dragging'); el.classList.add('back'); el.style.transform = ''; setTimeout(() => el.classList.remove('back'), 350); }
function validarPos(b, ignoreId){
  if (b.ini < 0 || b.fim > 1440) return {msg:'O bloco não pode atravessar a meia-noite', rn:'RN20'};
  const c = conflito(b, ignoreId);

// clicar no vazio da grade cria bloco com horário; chips sem horário abrem o modal
$('grid').addEventListener('click', e => {

/* ---------- lista: arrastar para reordenar ou trocar de dia (mouse) ---------- */
let ld = null;

});

addEventListener('pointermove', e => {

  // reordena o dia de destino: o bloco entra antes do card apontado

function pintarAttrs(){ $('fAttrs').innerHTML = ATRIBUTOS.map(a => `<button type="button" class="chip" data-pa="${a.id}" aria-pressed="${selAttrs.has(a.id)}"><span class="dot" style="background:${a.cor}"></span>${esc(a.nome)}</button>`).join(''); }
function estadoConcluido(){
  const pode = jaComecou({data:$('fData').value, ini: comHora() ? +$('fIni').value : null});
  $('fDone').disabled = !pode;
  if (!pode) $('fDone').checked = false;
  $('tWrap').style.opacity = pode ? 1 : .55;
  $('tHint').textContent = pode ? 'RF50' : 'disponível quando começar · RN37';
}
function contadores(){ $('cAcao').textContent = `${$('fAcao').value.length}/80`; $('cDesc').textContent = `${$('fDesc').value.length}/500`; }
$('fAcao').oninput = $('fDesc').oninput = contadores;
$('fData').onchange = $('fIni').onchange = estadoConcluido;
$('fAttrs').onclick = e => { const c = e.target.closest('[data-pa]'); if (!c) return; const id = +c.dataset.pa; selAttrs.has(id) ? selAttrs.delete(id) : selAttrs.add(id); pintarAttrs(); };
$('fHabito').onchange = () => { const h = habById(+$('fHabito').value); if (h){ h.attrs.forEach(a => selAttrs.add(a)); pintarAttrs(); } }; // RN23
$('mClose').onclick = $('mCancel').onclick = () => $('modal').close();
$('mDel').onclick = () => { const i = BLOCOS.findIndex(x => x.id === editId); const [b] = BLOCOS.splice(i,1); salvar(); $('modal').close(); render(); toast(`“${esc(b.acao)}” excluído`, 'RF09'); };

$('form').onsubmit = e => {
  e.preventDefault();
  const hora = comHora();
  const b = {acao:$('fAcao').value.trim(), data:$('fData').value, ini: hora ? +$('fIni').value : null, fim: hora ? +$('fFim').value : null,
             habito:$('fHabito').value ? +$('fHabito').value : null, attrs:[...selAttrs], desc:$('fDesc').value.trim(), concluido:$('fDone').checked};
  const erro = !b.acao ? ['Informe a ação do bloco (1 a 80 caracteres).','RN19']
    : !b.data ? ['Informe a data.','RN19']
    : hora && b.fim <= b.ini ? ['O fim precisa ser depois do início.','RN20'] : null;
  const c = !erro && conflito(b, editId);
  const msg = erro || (c && [`Sobrepõe “${esc(c.acao)}” (${fmtMin(c.ini)}–${fmtMin(c.fim)}). Encostar pode, sobrepor não.`,'RN21']);
  if (msg){ $('err').innerHTML = `${msg[0]} <span class="mono" style="opacity:.7">· ${msg[1]}</span>`; $('err').classList.add('show'); return; }
  const fimDoDia = Math.max(-10, ...BLOCOS.filter(x => x.data === b.data && x.id !== editId).map(ordemDe)) + 10;
  let novoId = null;
  if (editId){ const atual = BLOCOS.find(x => x.id === editId); if (atual.data !== b.data) b.ordem = fimDoDia; Object.assign(atual, b); toast('Bloco atualizado','RF08'); }
  else { novoId = _seq++; BLOCOS.push({id:novoId, ordem:fimDoDia, ...b}); toast('Bloco criado','RF07'); }
  salvar(); $('modal').close(); render(novoId);
};

/* ---------- visualização, semana, dias e filtros ---------- */
function trocarView(v){
  view = v; PERFIL.visualizacao = v; salvar(); render(true);
  if (v === 'grade') rolarParaAgora();
  toast(v === 'lista' ? 'Lista: o que fazer em cada dia, sem horário fixo' : 'Grade: cada bloco no seu horário');
}
document.querySelector('.vseg').onclick = e => { const b = e.target.closest('[data-view]'); if (b && b.dataset.view !== view) trocarView(b.dataset.view); };
function mudarSemana(n){ weekStart = addDays(weekStart, 7*n); render(); }
$('prev').onclick = () => mudarSemana(-1);
$('next').onclick = () => mudarSemana(1);
$('today').onclick = () => { weekStart = mondayOf(new Date()); diaSel = (new Date().getDay() - PERFIL.inicioSemana + 7) % 7; render(); rolarParaAgora(); };
$('newBtn').onclick = $('fab').onclick = () => abrirModal(null);
$('fBtn').onclick = () => { const o = $('filters').classList.toggle('open'); $('fBtn').setAttribute('aria-expanded', o); };
const escolherDia = i => { diaSel = i; render(); };
$('days').onclick = e => { const d = e.target.closest('.day'); if (d) escolherDia(+d.dataset.i); };
$('days').onkeydown = e => { const d = e.target.closest('.day'); if (d && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); escolherDia(+d.dataset.i); $('days').querySelector(`[data-i="${diaSel}"]`).focus(); } };
$('filters').onclick = e => {
  const a = e.target.closest('[data-fa]'), h = e.target.closest('[data-fh]');
  if (a){ const id = +a.dataset.fa; filtroAttr.has(id) ? filtroAttr.delete(id) : filtroAttr.add(id); }
  if (h){ const id = +h.dataset.fh; filtroHab.has(id) ? filtroHab.delete(id) : filtroHab.add(id); }
  if (e.target.id === 'clear'){ filtroAttr.clear(); filtroHab.clear(); }
  if (a || h || e.target.id === 'clear') render();
};

// celular: deslizar para o lado troca o dia (e a semana, nas pontas)
let sw = null;
$('board').addEventListener('touchstart', e => { if (e.target.closest('.block')) return; const t = e.touches[0]; sw = {x:t.clientX, y:t.clientY}; }, {passive:true});
$('board').addEventListener('touchend', e => {
  if (!sw || !mobile.matches) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const dir = dx < 0 ? 1 : -1;
  diaSel += dir;
  if (diaSel > 6){ diaSel = 0; weekStart = addDays(weekStart, 7); }
  if (diaSel < 0){ diaSel = 6; weekStart = addDays(weekStart, -7); }
  render();
  const alvo = view === 'lista' ? $('lanes') : $('scroll');
  alvo.classList.remove('swipe-l','swipe-r'); void alvo.offsetWidth; alvo.classList.add(dir > 0 ? 'swipe-l' : 'swipe-r');
});

document.addEventListener('keydown', e => {
  if ($('modal').open || e.target.matches('input,textarea,select')) return;
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); abrirModal(null); }
  if (e.key === 'v' || e.key === 'V'){ e.preventDefault(); trocarView(view === 'grade' ? 'lista' : 'grade'); }
  if (e.key === 'ArrowLeft' && e.altKey) mudarSemana(-1);
  if (e.key === 'ArrowRight' && e.altKey) mudarSemana(1);
});

function rolarParaAgora(){ $('scroll').scrollTop = Math.max(0, (new Date().getHours()-2) * 4 * ROW); }
render(); rolarParaAgora();
// a cada minuto: a linha do "agora" anda e blocos que começaram liberam o "concluído" (RN37)
setInterval(() => { if (!drag && !ld && !$('modal').open && !document.activeElement?.closest?.('.qadd')) render(); }, 60000);
</script>
