<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion · Caderno (protótipo)</title>
<!-- orion:css (gerado por build.mjs, edite assets/orion.css) -->
<style>
/* ============================================================
   Orion · base compartilhada dos protótipos
   Tokens da identidade visual + navbar (dock) + componentes
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400&display=swap');

:root{
  /* identidade (logo) + Cloud Blue */
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --line:#C4D3E3;
  --line-soft:#DDE6F0;
  --accent:#7FA5D1;        /* azul suave da logo */
  --accent-strong:#456C9C; /* azul aço da logo */
  --accent-hi:#2F5080;
  --ink:#111C2D;           /* tinta da logo */
  --ink-2:#2A3A50;
  --muted:#5A6B80;
  --danger:#B4453A;
  --ok:#2F7D5B;
  --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
  --display:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* tema escuro (RF46): cores da identidade visual, não uma inversão automática */
:root[data-theme="dark"]{
  --bg:#0C1522;
  --surface:#111C2D;
  --line:#22344D;
  --line-soft:#1A2A40;
  --accent:#7FA5D1;
  --accent-strong:#7FA5D1;
  --accent-hi:#9BBDE0;
  --ink:#EEF2F7;
  --ink-2:#C4D3E3;
  --muted:#8DA0B8;
  --danger:#E07A6E;
  --ok:#5CC195;
  color-scheme:dark;
}
:root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .btn.save,:root[data-theme="dark"] .chip[aria-pressed="true"],:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#EEF2F7;color:#0C1522;border-color:#EEF2F7}
:root[data-theme="dark"] .btn-primary:hover,:root[data-theme="dark"] .btn.save:hover{background:#9BBDE0}
:root[data-theme="dark"] .card{box-shadow:0 20px 40px -30px rgba(0,0,0,.8)}
:root[data-theme="dark"] .toast,:root[data-theme="dark"] .tt{background:#1E2F45}
:root[data-theme="dark"] .dock{background:rgba(30,47,69,.9)}
body{transition:background-color .3s,color .3s}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}

/* ===== Navbar estilo macOS ===== */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px 6px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px;color:var(--accent-strong);transition:transform .6s var(--ease)}
.brand:hover svg{transform:rotate(72deg)}
.brand span{font-family:var(--display);font-weight:300;font-size:17px;letter-spacing:.2em}
.dock{display:flex;align-items:flex-end;gap:6px;padding:7px 10px;background:rgba(17,28,45,.88);backdrop-filter:blur(18px) saturate(1.4);border-radius:18px;box-shadow:0 10px 30px -12px rgba(17,28,45,.5),inset 0 1px 0 rgba(255,255,255,.08);height:56px}
.dock a{position:relative;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#C4D3E3;text-decoration:none;transform-origin:bottom center;transition:transform .18s var(--ease),background .2s,color .2s}
.dock a svg{width:20px;height:20px}
.dock a:hover,.dock a:focus-visible{background:rgba(255,255,255,.08);color:#fff}
.dock a.active{color:#fff;background:linear-gradient(160deg,#7FA5D1,#456C9C)}
.dock a.active::after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:#C4D3E3}
.dock a.soon{opacity:.5}
.dock .tip{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(-4px);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s var(--ease);z-index:50}
.dock .tip small{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:6px}
.dock a:hover .tip,.dock a:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.dock .sep{width:1px;height:26px;background:rgba(196,211,227,.2);margin:0 4px 8px}
.user{justify-self:end;display:flex;align-items:center;gap:12px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
.user{position:relative}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,#7FA5D1,#456C9C);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;transition:transform .2s var(--ease),box-shadow .2s}
.avatar:hover,.avatar[aria-expanded="true"]{transform:scale(1.08);box-shadow:0 0 0 4px rgba(127,165,209,.3)}
.umenu{position:absolute;top:calc(100% + 10px);right:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 40px -16px rgba(17,28,45,.45);z-index:60;animation:pop .18s var(--ease)}
.umenu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
.umenu .who b{display:block;font-size:13px}
.umenu .who span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.umenu a,.umenu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none}
.umenu a:hover,.umenu button:hover,.umenu a:focus-visible,.umenu button:focus-visible{background:var(--bg)}
.umenu .sair{color:var(--danger)}

/* ===== Switch (ativar/desativar) ===== */
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);transition:background .25s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:active::after{width:22px}
.switch[aria-checked="true"]:active::after{transform:translateX(14px)}

/* ===== Busca e abas de filtro ===== */
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:220px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(127,165,209,.3)}
.search svg{width:16px;height:16px;color:var(--muted)}
.search input{border:0;outline:0;background:none;font:inherit;color:var(--ink);flex:1;min-width:0}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;position:relative}
.tabs button{height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .pill{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--bg);transition:left .3s var(--ease),width .3s var(--ease)}
.tabs button .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.7}

/* ===== Lista de itens (hábitos, hobbies) ===== */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.item{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:12px;transition:transform .25s var(--ease),box-shadow .25s,opacity .3s,border-color .2s}
.item:hover{transform:translateY(-2px);box-shadow:0 22px 40px -24px rgba(17,28,45,.5)}
.item.off{opacity:.62}
.item.off:hover{opacity:.85}
.item .row1{display:flex;align-items:center;gap:10px}
.item h3{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--c,#7FA5D1) 13%,transparent);color:var(--ink-2)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.origem{background:var(--bg);font-family:var(--mono);font-size:10.5px}
.tag.none{background:none;color:var(--muted);padding-left:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line-soft);padding-top:10px}
.nums div span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.nums div b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.empty-state{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
@media (pointer:coarse){.item .acts{opacity:1}}
.enter{animation:entra .45s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(10px) scale(.98)}}

/* ===== Página ===== */
.page{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 24px 24px;gap:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
.title p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(17,28,45,.03),0 20px 40px -30px rgba(17,28,45,.35)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== Controles ===== */
.seg{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{height:32px;min-width:34px;padding:0 10px;border-radius:7px;display:grid;place-items:center;transition:background .15s}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg svg{width:16px;height:16px}
.seg .lbl{min-width:150px;text-align:center;font-weight:600;font-size:13px}
.btn-primary{height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .15s var(--ease),background .2s}
.btn-primary:hover{background:var(--accent-strong);transform:translateY(-1px)}
.btn-primary svg{width:16px;height:16px}
.btn-primary kbd{font-family:var(--mono);font-size:11px;opacity:.6;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 5px}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:all .15s var(--ease)}
.chip:hover{border-color:var(--accent-strong)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn.del:hover{background:rgba(180,69,58,.1);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}

/* ===== Modal ===== */
dialog{margin:auto;border:0;padding:0;border-radius:18px;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(17,28,45,.5)}
dialog::backdrop{background:rgba(17,28,45,.35);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.m-head h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.m-head .path{font-family:var(--mono);font-size:11px;color:var(--muted)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--bg)}
.x svg{width:16px;height:16px}
dialog form,.m-body{padding:8px 20px 20px;display:grid;gap:14px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f label small{font-family:var(--mono);font-weight:400;color:var(--muted);float:right}
.f input,.f select,.f textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;color:var(--ink);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.f textarea{height:72px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(127,165,209,.3)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.err{font-size:12.5px;color:var(--danger);background:rgba(180,69,58,.08);border-radius:8px;padding:8px 10px;display:none}
.err.show{display:block}
.m-foot{display:flex;gap:8px;align-items:center}
.m-foot .sp{flex:1}
.btn{height:38px;padding:0 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);transition:background .15s}
.btn:hover{background:var(--bg)}
.btn.del{color:var(--danger);border-color:transparent}
.btn.del:hover{background:rgba(180,69,58,.08)}
.btn.save{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.save:hover{background:var(--accent-strong)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.danger:hover{background:#963329}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:100;box-shadow:0 14px 30px -12px rgba(17,28,45,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .rn{font-family:var(--mono);font-size:11px;color:#C4D3E3;border:1px solid rgba(196,211,227,.3);border-radius:5px;padding:1px 6px}
.toast.bad{background:#3A1814}

/* ===== Tooltip de gráfico ===== */
.tt{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:90;min-width:120px;box-shadow:0 12px 24px -10px rgba(17,28,45,.6)}
.tt.show{opacity:1;transform:none}
.tt b{font-weight:600}
.tt .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:11px;color:#C4D3E3}
.tt .r span:last-child{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.dock a{width:36px;height:36px}.topbar{grid-template-columns:auto 1fr;gap:12px}.dock{justify-self:end}.user{display:none}}
/* celular: só o símbolo da logo, dock compacto */
@media (max-width:700px){
  .topbar{padding:10px 12px 4px}
  .brand span{display:none}
  .dock{gap:2px;padding:5px 6px;height:48px;border-radius:15px}
  .dock a{width:34px;height:34px}
  .dock .sep{margin:0 2px 7px}
  .page{padding:10px 12px 16px}
  .title h1{font-size:22px}
}
/* toque: alvos de pelo menos 44px (WCAG 2.5.8) */
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .x{width:44px;height:44px}
  .seg button{height:40px;min-width:44px}
  .chip{height:36px}
}
</style>

<style>
body{overflow:hidden}
.book{flex:1;min-height:0;display:grid;grid-template-columns:220px 300px 1fr;overflow:hidden;transition:grid-template-columns .35s var(--ease)}
.pane{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line-soft)}
.pane:last-child{border-right:0}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.pane-h h2{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:lowercase}

/* divisórias (RF37 · RF38 · RF39) */
.divs{list-style:none;padding:0 8px 12px;overflow-y:auto;display:grid;gap:2px}
.div{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;height:38px;border-radius:9px;cursor:pointer;transition:background .15s;position:relative}
.div:hover{background:var(--bg)}
.div[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.div .nm{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.div .ct{font-family:var(--mono);font-size:11px;opacity:.6}
.div .del{opacity:0;width:28px;height:28px}
.div:hover .del,.div:focus-within .del{opacity:1}
.div[aria-selected="true"] .del{color:var(--surface)}
.div input{flex:1;min-width:0;border:0;outline:0;background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px;box-shadow:0 0 0 2px var(--accent-strong)}
.add-div{margin:0 8px 12px;height:36px;border-radius:9px;border:1.5px dashed var(--line);color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;padding:0 10px;transition:all .15s}
.add-div:hover{border-color:var(--accent-strong);color:var(--accent-strong)}
.add-div svg{width:15px;height:15px}

/* notas */
.notes-search{margin:0 12px 10px;min-width:0;height:36px}
.notes{list-style:none;padding:0 8px 12px;overflow-y:auto;display:grid;gap:4px;align-content:start}
.note{padding:10px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.note:hover{background:var(--bg)}
.note[aria-selected="true"]{background:var(--surface);border-color:var(--line);box-shadow:0 10px 24px -18px rgba(17,28,45,.5)}
.note h3{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note p{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.note time{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.note mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px}
.notes .vazio{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}

/* editor (RF35 · RF36) */
.editor{background:var(--surface)}
.ed-bar{display:flex;align-items:center;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.ed-bar .tool{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:13px;transition:background .15s,color .15s}
.ed-bar .tool:hover{background:var(--bg)}
.ed-bar .tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ed-bar .tool svg{width:16px;height:16px}
.ed-bar .sepv{width:1px;height:18px;background:var(--line);margin:0 6px}
.ed-bar .sp{flex:1}
.status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);transition:background .2s}
.status.saving i{background:var(--accent);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.ed-scroll{flex:1;overflow-y:auto;padding:28px 0 60px}
.ed-inner{max-width:720px;margin:0 auto;padding:0 32px}
.ed-title{width:100%;border:0;outline:0;background:none;font:inherit;font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink);padding:0}
.ed-title::placeholder{color:var(--line)}

/* ============================================================
   Orion · núcleo compartilhado dos protótipos
   Navbar (dock), relógio, toast, tooltip, dados de exemplo e regras

/* ---------- datas e formatos ---------- */
const STEP = 15;
const DIAS = ['seg','ter','qua','qui','sex','sáb','dom'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
// início da semana vem do perfil (RN33: padrão segunda). Trocar só muda a visualização (RN35)
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() - PERFIL.inicioSemana + 7) % 7)); };

const fmtMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return r ? `${h}h${pad(r)}` : `${h}h`; };
const startOf = b => new Date(+parseIso(b.data) + b.ini*60000);
const endOf   = b => new Date(+parseIso(b.data) + b.fim*60000);

/* rotina-modelo por dia da semana (0 = seg): [início h, fim h, ação, hábito, atributos] */
const ROTINA = [
  [[6.5,7.5,'Treino de força',2,[4,1]],[8,9,'Ler 30 páginas',1,[2]],[19,21,'API de Atributos',5,[2]]],

/* pseudoaleatório determinístico: o mesmo dia gera sempre os mesmos blocos */
function rnd(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }

let _seq = 1;
const _gerados = new Set();
const BLOCOS = [];
/** Garante que os blocos de [de, ate] existem (gera a partir da rotina). */
function garantirPeriodo(de, ate){
  const agora = new Date();
  for (let d = new Date(de); d <= ate; d = addDays(d,1)){
    const k = iso(d);
    if (_gerados.has(k)) continue;
    _gerados.add(k);
    ROTINA[(d.getDay()+6)%7].forEach(([i,f,acao,hab,attrs], n) => {
      if (rnd(k+n+'x') < 0.12) return; // às vezes o bloco não foi planejado
      if (BLOCOS.some(o => o.data === k && i*60 < o.fim && o.ini < f*60)) return; // não gera por cima de um bloco seu (RN21)
      if (hab && !habById(hab)) hab = null; // hábito excluído
      attrs = attrs.filter(attrById);       // atributo excluído
      const b = {id:_seq++, data:k, ini:i*60, fim:f*60, acao, habito:hab, attrs:[...attrs], desc:'', concluido:false};
      if (endOf(b) <= agora && rnd(k+n+'c') < 0.76) b.concluido = true; // RN37: só o que já começou
      BLOCOS.push(b);
    });
  }
}
const blocosEntre = (de, ate) => { garantirPeriodo(de, ate); const a = iso(de), z = iso(ate); return BLOCOS.filter(b => b.data >= a && b.data <= z); };

/* ---------- persistência (só do protótipo; no produto isso é a API) ----------
   Salva tudo ao sair da página e carrega ao abrir. Assim, um hábito criado
   em Hábitos aparece na Minha Semana. */
const CHAVE = 'orion.prototipo.v1';
const _troca = (arr, novo) => { if (Array.isArray(novo)) arr.splice(0, arr.length, ...novo); };
let _naoSalvar = false;
function salvar(){
  if (_naoSalvar) return;
  try { localStorage.setItem(CHAVE, JSON.stringify({ATRIBUTOS, HOBBIES, HABITOS, BLOCOS, DIVISORIAS, NOTAS, PERFIL, seq:_seq, gerados:[..._gerados]})); } catch {}
}
function restaurarExemplo(){ _naoSalvar = true; localStorage.removeItem(CHAVE); location.reload(); } // sem isso, o salvamento ao sair regravaria tudo
(function carregar(){
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE) || 'null');
    if (!s) return;
    _troca(ATRIBUTOS, s.ATRIBUTOS); _troca(HOBBIES, s.HOBBIES); _troca(HABITOS, s.HABITOS); _troca(BLOCOS, s.BLOCOS);
    _troca(DIVISORIAS, s.DIVISORIAS); _troca(NOTAS, s.NOTAS); Object.assign(PERFIL, s.PERFIL);
    _seq = s.seq || _seq; (s.gerados || []).forEach(k => _gerados.add(k));
  } catch {}
})();
addEventListener('pagehide', salvar);
document.addEventListener('visibilitychange', () => document.hidden && salvar());

/* aparência (RF46 · RN36): aplicada na hora */
const aplicarTema = () => document.documentElement.dataset.theme = PERFIL.aparencia === 'escuro' ? 'dark' : 'light';
aplicarTema();

/* números que "contam" até o valor: dá vida às estatísticas */
function contar(el, alvo, fmt = v => Math.round(v), ms = 650){
  if (!el) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = fmt(alvo); return; }
  const de = +(el.dataset.v || 0), t0 = performance.now();
  el.dataset.v = alvo;
  const passo = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(de + (alvo - de) * e); if (p < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
/* pequeno "estouro" de partículas na cor dada: recompensa visual ao concluir algo */
function estouro(x, y, cor = '#456C9C'){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 10; i++){
    const p = document.createElement('i');
    const a = (Math.PI * 2 * i) / 10, d = 22 + Math.random() * 14;
    p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:5px;height:5px;border-radius:50%;background:${cor};pointer-events:none;z-index:200;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s`;
    document.body.appendChild(p);
    requestAnimationFrame(() => { p.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.4)`; p.style.opacity = 0; });
    setTimeout(() => p.remove(), 520);
  }
}

/* ---------- estatísticas (RN25, RN26, RN28) ---------- */
function estatisticas(lista, attrId){
  const L = attrId ? lista.filter(b => b.attrs.includes(attrId)) : lista; // RN25: bloco conta inteiro para cada atributo
  const dur = b => b.fim - b.ini;
  const agora = new Date();
  const terminados = L.filter(b => endOf(b) <= agora);
  return {
    planejado: L.reduce((s,b) => s + dur(b), 0),
    feito: L.filter(b => b.concluido).reduce((s,b) => s + dur(b), 0),
    total: L.length,
    concluidos: L.filter(b => b.concluido).length,
    terminados: terminados.length,
    consistencia: terminados.length ? Math.round(terminados.filter(b => b.concluido).length / terminados.length * 100) : null, // RN28: null = "sem dados"
  };
}
const fmtCons = c => c === null ? 'sem dados' : c + '%';

function montarTopbar(atual){

  menu.addEventListener('keydown', e => { if (e.key === 'Escape'){ abrir(false); av.focus(); } });
  $('temaRapido').onclick = () => { PERFIL.aparencia = PERFIL.aparencia === 'escuro' ? 'claro' : 'escuro'; aplicarTema(); salvar(); $('temaRapido').textContent = PERFIL.aparencia === 'escuro' ? 'Tema claro' : 'Tema escuro'; document.dispatchEvent(new Event('tema')); };
  $('sair').onclick = () => { localStorage.removeItem('orion.sessao'); salvar(); location.href = 'login.html'; }; // RN07: apaga o token

  // ampliação estilo macOS (respeita reduced motion)
  const dock = $('dock'), items = [...dock.querySelectorAll('a')];
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    dock.addEventListener('mousemove', e => items.forEach(it => {
      const r = it.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width/2));
      it.style.transform = `scale(${1 + Math.max(0, 1 - d/110) * 0.32})`;
    }));
    dock.addEventListener('mouseleave', () => items.forEach(it => it.style.transform = ''));
  }
  const tick = () => { const n = new Date(); $('clock').textContent = n.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'') + ' · ' + fmtMin(n.getHours()*60+n.getMinutes()); };
  tick(); setInterval(tick, 30000);

  if (!$('toast')) document.body.insertAdjacentHTML('beforeend', '<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="tt" id="tt" role="tooltip"></div>');
}

/* ---------- toast e tooltip ---------- */
let _tt;
function toast(msg, rn, bad){
  const t = $('toast');
  t.innerHTML = `<span>${msg}</span>${rn?`<span class="rn">${rn}</span>`:''}`;
  t.classList.toggle('bad', !!bad);
  t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 3200);
}
function tooltip(e, html){
  const t = $('tt');
  if (!html){ t.classList.remove('show'); return; }
  t.innerHTML = html;
  t.classList.add('show');
  const w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y < 8) y = e.clientY + 16;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
</script>
<!-- /orion:js -->
<script>
/* Caderno · RF33–RF39 · regras RN29–RN32
   O editor aqui usa contenteditable só para o protótipo. No produto, o editor é o TipTap. */
montarTopbar('caderno');
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const MAX = 50000;
let divAtual = DIVISORIAS[0]?.id, notaAtual = null, busca = '', renomeando = null;

const notasDa = id => NOTAS.filter(n => n.div === id).sort((a, b) => b.atualizada - a.atualizada);
// espaço depois de cada bloco (</li>, </p>...) para o trecho não grudar as palavras
const textoDe = html => { const d = document.createElement('div'); d.innerHTML = html.replace(/<\/(p|li|h[1-6]|pre|blockquote)>|<br\s*\/?>/gi, '$& '); return d.textContent || ''; };
function quando(ms){
  const s = (Date.now() - ms) / 1000;
  if (s < 45) return 'agora';
  if (s < 3600) return `há ${Math.round(s/60)} min`;
  if (s < 86400) return `há ${Math.round(s/3600)} h`;
  const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${fmtMin(d.getHours()*60+d.getMinutes())}`;
}
const marcar = (t, q) => q ? esc(t).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>') : esc(t);

/* ---------- divisórias ---------- */
function renderDivs(){
  $('divs').innerHTML = DIVISORIAS.map(d => d.id === renomeando
    ? `<li class="div" aria-selected="${d.id === divAtual}"><input id="rename" value="${esc(d.nome)}" maxlength="40" aria-label="Nome da divisória"></li>`
    : `<li class="div" role="option" tabindex="0" aria-selected="${d.id === divAtual}" data-div="${d.id}" title="Duplo clique para renomear">
        <span class="nm">${esc(d.nome)}</span><span class="ct">${notasDa(d.id).length}</span>
        <button class="icon-btn del" data-deldiv="${d.id}" aria-label="Excluir divisória ${esc(d.nome)}" ${DIVISORIAS.length === 1 ? 'disabled title="A última divisória não pode ser excluída (RN30)"' : ''}>${TRASH}</button></li>`).join('');
  const inp = $('rename');
  if (inp){
    inp.focus(); inp.select();
    const fim = ok => { if (renomeando === null) return; const d = DIVISORIAS.find(x => x.id === renomeando); renomeando = null; if (ok) salvarDiv(d, inp.value); else renderDivs(); };
    inp.onkeydown = e => { if (e.key === 'Enter') fim(true); if (e.key === 'Escape') fim(false); };
    inp.onblur = () => fim(true);
  }
  $('sub').textContent = `${DIVISORIAS.length} divisórias · ${NOTAS.length} notas`;
}
function salvarDiv(d, nome){
  nome = nome.trim();
  const erro = !nome ? 'A divisória precisa de um nome (1 a 40 caracteres).' : DIVISORIAS.some(x => x !== d && x.nome.toLowerCase() === nome.toLowerCase()) ? `Já existe a divisória “${esc(nome)}”.` : null;
  if (erro){ if (d._nova){ DIVISORIAS.splice(DIVISORIAS.indexOf(d), 1); divAtual = DIVISORIAS[0].id; } toast(erro, 'RN30', true); render(); return; }
  const nova = d._nova; delete d._nova; d.nome = nome; salvar();
  if (nova){ divAtual = d.id; notaAtual = null; toast(`Divisória “${esc(nome)}” criada`, 'RF37'); } else toast('Divisória renomeada', 'RN30');
  render();
}
$('addDiv').onclick = () => {
  const d = {id: Math.max(0, ...DIVISORIAS.map(x => x.id)) + 1, nome:'', _nova:true};
  DIVISORIAS.push(d); renomeando = d.id; renderDivs();
};
$('divs').addEventListener('click', e => {
  const del = e.target.closest('[data-deldiv]');
  if (del){ e.stopPropagation(); return pedirExclusaoDiv(+del.dataset.deldiv); }
  const li = e.target.closest('[data-div]'); if (!li) return;
  divAtual = +li.dataset.div; notaAtual = notasDa(divAtual)[0]?.id ?? null; busca = ''; $('q').value = '';
  $('book').dataset.v = 'notas'; render();
});
$('divs').addEventListener('dblclick', e => { const li = e.target.closest('[data-div]'); if (li){ renomeando = +li.dataset.div; renderDivs(); } });
$('divs').addEventListener('keydown', e => {
  const li = e.target.closest('[data-div]'); if (!li) return;
  if (e.key === 'Enter') li.click();
  if (e.key === 'F2'){ renomeando = +li.dataset.div; renderDivs(); }
});

/* ---------- notas ---------- */
function renderNotas(){
  const d = DIVISORIAS.find(x => x.id === divAtual);
  const lista = busca ? NOTAS.filter(n => (n.titulo + ' ' + textoDe(n.html)).toLowerCase().includes(busca.toLowerCase())).sort((a,b) => b.atualizada - a.atualizada) : notasDa(divAtual);
  $('divName').textContent = busca ? `busca: “${busca}”` : (d?.nome || '').toLowerCase();
  $('nCount').textContent = lista.length;
  $('notes').innerHTML = lista.length ? lista.map(n => {
    const t = textoDe(n.html).replace(/\s+/g, ' ').trim();
    return `<li class="note" role="option" tabindex="0" aria-selected="${n.id === notaAtual}" data-note="${n.id}">
      <h3>${marcar(n.titulo || 'Sem título', busca)}</h3><p>${marcar(t.slice(0, 140) || 'Nota vazia', busca)}</p>
      <time>${quando(n.atualizada)}${busca ? ' · ' + esc(DIVISORIAS.find(x => x.id === n.div)?.nome || '') : ''}</time></li>`;
  }).join('') : `<li class="vazio">${busca ? 'Nenhuma nota encontrada.' : 'Esta divisória ainda não tem notas.<br>Crie uma com a tecla N.'}</li>`;
}
$('notes').addEventListener('click', e => { const li = e.target.closest('[data-note]'); if (!li) return; notaAtual = +li.dataset.note; $('book').dataset.v = 'editor'; renderNotas(); renderEditor(); });
$('notes').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest('[data-note]')?.click(); });
$('q').oninput = e => { busca = e.target.value.trim(); renderNotas(); };

function novaNota(){
  if (!DIVISORIAS.some(d => d.id === divAtual)) divAtual = DIVISORIAS[0].id;
  const n = {id: Math.max(0, ...NOTAS.map(x => x.id)) + 1, div: divAtual, titulo:'', html:'', criada: Date.now(), atualizada: Date.now()};
  NOTAS.push(n); notaAtual = n.id; busca = ''; $('q').value = '';
  $('book').dataset.v = 'editor'; render();
  setTimeout(() => $('edTitle')?.focus(), 30);
  toast('Nota criada', 'RF35');
}
$('newNote').onclick = novaNota;

/* ---------- editor ---------- */
const TOOLS = [
  ['bold','B','Negrito (Ctrl+B)'], ['italic','<i style="font-family:serif">I</i>','Itálico (Ctrl+I)'], '|',
  ['h2','H','Título'], ['insertUnorderedList','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>','Lista'],
  ['blockquote','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7h4v6H5V9a2 2 0 0 1 2-2zM15 7h4v6h-6V9a2 2 0 0 1 2-2z"/></svg>','Citação'],
  ['code','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m8 16-4-4 4-4M16 8l4 4-4 4"/></svg>','Código'],
];
let tSalvar;
function renderEditor(){
  const n = NOTAS.find(x => x.id === notaAtual);
  if (!n){ $('editor').innerHTML = `<div class="ed-empty"><div><b>Nenhuma nota aberta</b>Escolha uma nota ou crie uma com a tecla N.</div></div>`; return; }
  const div = DIVISORIAS.find(x => x.id === n.div);
  $('editor').innerHTML = `
    <div class="ed-bar">
      <button class="icon-btn back" data-go="notas" aria-label="Voltar para notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      ${TOOLS.map(t => t === '|' ? '<span class="sepv"></span>' : `<button class="tool" data-cmd="${t[0]}" title="${t[2]}" aria-label="${t[2]}" aria-pressed="false">${t[1]}</button>`).join('')}
      <span class="sp"></span>
      <span class="status" id="status"><i></i><span id="stTxt">salvo · ${quando(n.atualizada)}</span></span>
      <button class="icon-btn" id="full" aria-label="Tela cheia" title="Tela cheia (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="icon-btn del" id="delNote" aria-label="Excluir nota">${TRASH}</button>
    </div>
    <div class="ed-scroll"><div class="ed-inner">
      <input class="ed-title" id="edTitle" maxlength="120" placeholder="Título da nota" value="${esc(n.titulo)}" aria-label="Título da nota">
      <div class="ed-meta"><span>${esc(div?.nome || '')}</span><span>criada ${quando(n.criada)}</span><span id="edCount"></span><span>PUT /api/v1/notas/${n.id}</span></div>
      <div class="ed-body" id="edBody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Conteúdo da nota">${n.html}</div>
    </div></div>`;
  contarCaracteres();
  $('edTitle').oninput = () => mudou();
  $('edBody').oninput = () => mudou();
  $('edBody').onkeyup = $('edBody').onmouseup = estadoFerramentas;
  $('full').onclick = alternarTelaCheia;
  $('delNote').onclick = () => pedirExclusaoNota(n.id);
  document.querySelectorAll('.tool').forEach(b => b.onmousedown = e => { e.preventDefault(); aplicar(b.dataset.cmd); });
}
function contarCaracteres(){
  const len = ($('edBody')?.innerText || '').length, words = ($('edBody')?.innerText.trim().match(/\S+/g) || []).length;
  if ($('edCount')) $('edCount').innerHTML = `${words} palavras · <span style="color:${len > MAX ? 'var(--danger)' : 'inherit'}">${len.toLocaleString('pt-BR')}/${MAX.toLocaleString('pt-BR')}</span>`;
}
function mudou(){
  contarCaracteres();
  $('status').classList.add('saving'); $('stTxt').textContent = 'salvando…';
  clearTimeout(tSalvar);
  tSalvar = setTimeout(() => {
    const n = NOTAS.find(x => x.id === notaAtual); if (!n) return;
    const titulo = $('edTitle').value.trim(), html = $('edBody').innerHTML;
    if (!titulo){ $('status').classList.remove('saving'); $('stTxt').textContent = 'título obrigatório · RN32'; $('status').style.color = 'var(--danger)'; return; }
    if ($('edBody').innerText.length > MAX){ $('status').classList.remove('saving'); $('stTxt').textContent = 'passou de 50.000 · RN32'; $('status').style.color = 'var(--danger)'; return; }
    $('status').style.color = '';
    Object.assign(n, {titulo, html, atualizada: Date.now()}); salvar(); // dataAtualizacao muda a cada edição (RN32)
    $('status').classList.remove('saving'); $('stTxt').textContent = 'salvo · agora';
    renderNotas(); renderDivs();
  }, 600);
}
function aplicar(cmd){
  const ed = $('edBody'); ed.focus();
  if (cmd === 'h2') document.execCommand('formatBlock', false, document.queryCommandValue('formatBlock') === 'h2' ? 'p' : 'h2');
  else if (cmd === 'blockquote') document.execCommand('formatBlock', false, document.queryCommandValue('formatBlock') === 'blockquote' ? 'p' : 'blockquote');
  else if (cmd === 'code'){ const s = getSelection().toString() || 'código'; document.execCommand('insertHTML', false, `<code>${esc(s)}</code>&nbsp;`); }
  else document.execCommand(cmd);
  estadoFerramentas(); mudou();
}
function estadoFerramentas(){
  const bloco = document.queryCommandValue('formatBlock');
  document.querySelectorAll('.tool').forEach(b => {
    const c = b.dataset.cmd;
    const on = c === 'h2' || c === 'blockquote' ? bloco === c : c === 'code' ? false : document.queryCommandState(c);
    b.setAttribute('aria-pressed', on);
  });
}
function alternarTelaCheia(){
  document.body.classList.toggle('full');
  toast(document.body.classList.contains('full') ? 'Tela cheia · Esc para sair' : 'Saiu da tela cheia');
}

/* ---------- excluir (RF39 · RN30 · RN31) ---------- */
let acaoConfirmar = null;
function pedirExclusaoDiv(id){
  if (DIVISORIAS.length === 1) return toast('A última divisória não pode ser excluída', 'RN30', true);
  const d = DIVISORIAS.find(x => x.id === id), qtd = notasDa(id).length;
  $('cTitle').textContent = `Excluir a divisória “${d.nome}”?`; $('cPath').textContent = `DELETE /api/v1/divisorias/${id}`;
  $('cText').innerHTML = qtd ? `As <b>${qtd} notas</b> dentro dela também serão excluídas. Isso não pode ser desfeito (RN31).` : 'Ela está vazia. Isso não pode ser desfeito.';
  acaoConfirmar = () => {
    for (let i = NOTAS.length - 1; i >= 0; i--) if (NOTAS[i].div === id) NOTAS.splice(i, 1);
    DIVISORIAS.splice(DIVISORIAS.indexOf(d), 1);
    if (divAtual === id){ divAtual = DIVISORIAS[0].id; notaAtual = notasDa(divAtual)[0]?.id ?? null; }
    toast(`Divisória “${esc(d.nome)}” excluída${qtd ? ` com ${qtd} notas` : ''}`, 'RN31');
  };
  $('confirm').showModal();
}
function pedirExclusaoNota(id){
  const n = NOTAS.find(x => x.id === id);
  $('cTitle').textContent = `Excluir “${n.titulo || 'Sem título'}”?`; $('cPath').textContent = `DELETE /api/v1/notas/${id}`;
  $('cText').textContent = 'A nota será excluída. Isso não pode ser desfeito.';
  acaoConfirmar = () => { NOTAS.splice(NOTAS.indexOf(n), 1); notaAtual = notasDa(divAtual)[0]?.id ?? null; $('book').dataset.v = 'notas'; toast('Nota excluída', 'RF39'); };
  $('confirm').showModal();
}
$('cOk').onclick = () => { acaoConfirmar?.(); salvar(); $('confirm').close(); render(); };

/* ---------- geral ---------- */
function render(){ renderDivs(); renderNotas(); renderEditor(); }
document.addEventListener('click', e => {
  const cl = e.target.closest('[data-close]'); if (cl) return cl.closest('dialog').close();
  const go = e.target.closest('[data-go]'); if (go){ $('book').dataset.v = go.dataset.go; if (document.body.classList.contains('full')) alternarTelaCheia(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('full') && !document.querySelector('dialog[open]')) return alternarTelaCheia();
  if (document.querySelector('dialog[open]') || e.target.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); novaNota(); }
  if (e.key === '/'){ e.preventDefault(); $('q').focus(); }
  if ((e.key === 'f' || e.key === 'F') && notaAtual){ e.preventDefault(); alternarTelaCheia(); }
});
notaAtual = notasDa(divAtual)[0]?.id ?? null;
if (innerWidth > 860) $('book').dataset.v = 'editor';
render();
setInterval(() => { renderNotas(); }, 60000); // "há x min" atualiza
</script>
